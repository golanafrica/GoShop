run:
  timeout: 5m
  issues-exit-code: 1

linters:
  disable-all: true
  enable:
    - gosec
    - govet
    - staticcheck
    - errcheck
    - bodyclose
    - ineffassign
    - misspell

linters-settings:
  gosec:
    excludes:
      # On garde uniquement les exclusions légitimes
      - G201 # Le formatage SQL dynamique est utilisé de manière contrôlée avec des paramètres ($1, $2)
  errcheck:
    # On retire TOUTES les exclusions de fonctions. 
    # Si une erreur doit être ignorée, le code doit explicitement utiliser `_ = fonction()`

issues:
  exclude-rules:
    # 1. Ignorer les règles strictes dans les tests et les mocks (C'est une bonne pratique, on garde)
    - path: _test\.go
      linters: [gosec, errcheck, unparam, prealloc, gocritic, bodyclose, ineffassign]
    - path: mocks/
      linters: [gosec, errcheck, unparam, gocritic, ineffassign]
    - path: tests/
      linters: [gosec, errcheck, unparam, gocritic, bodyclose, ineffassign]
    
    # 2. Ignorer les fautes d'orthographe dans les commentaires en français (Nécessaire)
    - linters: [misspell]
      text: "is a misspelling of"