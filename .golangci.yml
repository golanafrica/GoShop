run:
  timeout: 5m
  issues-exit-code: 1

linters:
  disable-all: true
  enable:
    - gosec
    - govet
    - staticcheck
    - errcheck
    - bodyclose
    - ineffassign
    - misspell

linters-settings:
  gosec:
    excludes:
      - G201

issues:
  exclude-rules:
    - path: _test\.go
      linters: [gosec, errcheck, unparam, prealloc, gocritic, bodyclose, ineffassign]
    - path: mocks/
      linters: [gosec, errcheck, unparam, gocritic, ineffassign]
    - path: tests/
      linters: [gosec, errcheck, unparam, gocritic, bodyclose, ineffassign]
    - linters: [misspell]
      text: "is a misspelling of"