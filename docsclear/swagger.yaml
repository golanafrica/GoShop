host: localhost:8080
info:
  contact:
    email: support@goshop.dev
    name: API Support
  description: GoShop - E-commerce API with observability and metrics
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: GoShop API
  version: 1.0.0
paths:
  /api/admin/2fa/disable:
    post:
      consumes:
      - application/json
      description: Désactive la double authentification en utilisant soit le code
        TOTP actuel, soit un code de récupération.
      parameters:
      - description: Code TOTP ou code de récupération
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/twofausecase.Disable2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Code invalide
          schema:
            $ref: '#/definitions/utils.AppError'
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "409":
          description: La 2FA n'est pas activée
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Désactiver la 2FA
      tags:
      - Two-Factor Authentication (2FA)
  /api/admin/2fa/regenerate-codes:
    post:
      consumes:
      - application/json
      description: Génère de nouveaux codes de récupération à usage unique, invalidant
        les anciens. Nécessite une validation TOTP.
      parameters:
      - description: Code TOTP actuel pour validation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/twofausecase.RegenerateRecoveryCodesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Code invalide
          schema:
            $ref: '#/definitions/utils.AppError'
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "409":
          description: La 2FA n'est pas activée
          schema:
            $ref: '#/definitions/utils.AppError'
        "429":
          description: Code déjà utilisé (protection anti-replay)
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Régénérer les codes de récupération 2FA
      tags:
      - Two-Factor Authentication (2FA)
  /api/admin/2fa/setup:
    post:
      consumes:
      - application/json
      description: Génère un secret TOTP et un QR code pour configurer une application
        d'authentification (Google Authenticator, Authy, etc.).
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "409":
          description: La 2FA est déjà activée
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Initialiser la configuration 2FA
      tags:
      - Two-Factor Authentication (2FA)
  /api/admin/2fa/status:
    get:
      consumes:
      - application/json
      description: Vérifie si la double authentification est activée pour un utilisateur
        donné.
      parameters:
      - description: 'ID de l''utilisateur cible (défaut: utilisateur connecté)'
        in: query
        name: user_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "403":
          description: Interdit (droits insuffisants)
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Obtenir le statut 2FA d'un utilisateur
      tags:
      - Two-Factor Authentication (2FA)
  /api/admin/2fa/verify:
    post:
      consumes:
      - application/json
      description: Valide le code TOTP à 6 chiffres pour activer définitivement la
        double authentification.
      parameters:
      - description: Code TOTP à 6 chiffres
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/twofausecase.VerifyAndEnable2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Code invalide ou format incorrect
          schema:
            $ref: '#/definitions/utils.AppError'
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Vérifier et activer la 2FA
      tags:
      - Two-Factor Authentication (2FA)
  /api/admin/api-keys:
    get:
      consumes:
      - application/json
      description: Récupère la liste paginée des clés API d'un utilisateur (ou de
        tous les utilisateurs pour les admins).
      parameters:
      - description: ID de l'utilisateur cible (admin seulement)
        in: query
        name: user_id
        type: string
      - description: 'Ne retourner que les clés actives (défaut: true)'
        in: query
        name: active_only
        type: boolean
      - description: 'Nombre de résultats (défaut: 50, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Décalage (défaut: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apikeyusecase.ListAPIKeysResponse'
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "403":
          description: Interdit (RBAC)
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Lister les clés API
      tags:
      - API Key Management
    post:
      consumes:
      - application/json
      description: Génère une nouvelle clé API pour un utilisateur avec des scopes
        spécifiques. La clé complète n'est affichée qu'une seule fois à la création.
      parameters:
      - description: Détails de la clé API (name, scopes, is_test)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apikeyusecase.CreateAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/apikeyusecase.CreateAPIKeyResponse'
        "400":
          description: Payload invalide ou champs manquants
          schema:
            $ref: '#/definitions/utils.AppError'
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "403":
          description: Interdit (RBAC)
          schema:
            $ref: '#/definitions/utils.AppError'
        "429":
          description: Limite de clés atteinte
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Créer une nouvelle clé API
      tags:
      - API Key Management
  /api/admin/api-keys/revoke:
    post:
      consumes:
      - application/json
      description: Révoque une clé API spécifique, l'empêchant d'être utilisée pour
        de futures requêtes.
      parameters:
      - description: ID de la clé et motif de révocation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apikeyusecase.RevokeAPIKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apikeyusecase.RevokeAPIKeyResponse'
        "400":
          description: Payload invalide ou api_key_id manquant
          schema:
            $ref: '#/definitions/utils.AppError'
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "403":
          description: Interdit (RBAC)
          schema:
            $ref: '#/definitions/utils.AppError'
        "404":
          description: Clé API introuvable
          schema:
            $ref: '#/definitions/utils.AppError'
        "409":
          description: Clé déjà révoquée
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Révoquer une clé API
      tags:
      - API Key Management
  /api/admin/api-keys/revoke-all:
    post:
      consumes:
      - application/json
      description: Révoque toutes les clés API actives associées à un utilisateur
        spécifique.
      parameters:
      - description: ID de l'utilisateur et motif de révocation
        in: body
        name: request
        schema:
          $ref: '#/definitions/apikeyusecase.RevokeAllAPIKeysRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apikeyusecase.RevokeAllAPIKeysResponse'
        "400":
          description: Payload invalide
          schema:
            $ref: '#/definitions/utils.AppError'
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "403":
          description: Interdit (RBAC)
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Révoquer toutes les clés API d'un utilisateur
      tags:
      - API Key Management
  /api/admin/api-keys/stats:
    get:
      consumes:
      - application/json
      description: Récupère les statistiques d'utilisation et l'état des clés API
        pour un utilisateur ou globalement.
      parameters:
      - description: ID de l'utilisateur cible (admin seulement)
        in: query
        name: user_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apikeyusecase.GetAPIKeyStatsResponse'
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "403":
          description: Interdit (RBAC)
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Obtenir les statistiques des clés API
      tags:
      - API Key Management
  /api/admin/collaborators/platform:
    get:
      consumes:
      - application/json
      description: Récupère la liste paginée et filtrée des collaborateurs de la plateforme.
      parameters:
      - description: Filtrer par rôle
        in: query
        name: role
        type: string
      - description: Recherche par email ou nom
        in: query
        name: search
        type: string
      - description: Filtrer par statut actif (true/false)
        in: query
        name: is_active
        type: boolean
      - description: 'Nombre de résultats (défaut: 20)'
        in: query
        name: limit
        type: integer
      - description: 'Décalage (défaut: 0)'
        in: query
        name: offset
        type: integer
      - description: Colonne de tri
        in: query
        name: sort_by
        type: string
      - description: Ordre de tri (ASC/DESC)
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/collaboratorusecase.ListCollaboratorsResponse'
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "403":
          description: Interdit (RBAC)
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Lister les collaborateurs plateforme
      tags:
      - Collaborator Management
  /api/admin/collaborators/platform/{id}:
    delete:
      consumes:
      - application/json
      description: Révoque l'accès d'un collaborateur au niveau de la plateforme.
      parameters:
      - description: ID du collaborateur (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Motif de la suppression
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/collaboratorusecase.RemoveCollaboratorResponse'
        "400":
          description: Motif requis ou payload invalide
          schema:
            $ref: '#/definitions/utils.AppError'
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "403":
          description: 'Interdit (ex: tentative de se supprimer soi-même)'
          schema:
            $ref: '#/definitions/utils.AppError'
        "404":
          description: Collaborateur introuvable
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Supprimer un collaborateur plateforme
      tags:
      - Collaborator Management
  /api/admin/collaborators/platform/{id}/role:
    put:
      consumes:
      - application/json
      description: Met à jour le rôle d'un collaborateur existant au niveau de la
        plateforme.
      parameters:
      - description: ID du collaborateur (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Nouveau rôle
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/collaboratorusecase.UpdateCollaboratorRoleResponse'
        "400":
          description: Payload invalide ou rôle invalide
          schema:
            $ref: '#/definitions/utils.AppError'
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "403":
          description: 'Interdit (ex: tentative de modifier son propre rôle)'
          schema:
            $ref: '#/definitions/utils.AppError'
        "404":
          description: Collaborateur introuvable
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Modifier le rôle d'un collaborateur plateforme
      tags:
      - Collaborator Management
  /api/admin/collaborators/platform/invite:
    post:
      consumes:
      - application/json
      description: Envoie une invitation par email pour ajouter un collaborateur au
        niveau de la plateforme.
      parameters:
      - description: Détails de l'invitation (email, role)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/collaboratorusecase.InvitePlatformCollaboratorRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/collaboratorusecase.InvitePlatformCollaboratorResponse'
        "400":
          description: Payload invalide ou email déjà invité
          schema:
            $ref: '#/definitions/utils.AppError'
