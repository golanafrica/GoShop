          schema:
            $ref: '#/definitions/utils.AppError'
        "403":
          description: 'Interdit (RBAC: merchant, shop_admin requis)'
          schema:
            $ref: '#/definitions/utils.AppError'
        "404":
          description: Boutique introuvable
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Inviter un collaborateur boutique
      tags:
      - Collaborator Management
  /api/shops/payment-settings:
    get:
      consumes:
      - application/json
      description: Retourne les configurations de paiement de la boutique identifiée
        par le contexte multi-tenant (header X-Shop-Slug).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/shopdto.PaymentSettingsResponse'
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "403":
          description: Contexte multi-tenant manquant ou interdit
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Récupérer les paramètres de paiement de la boutique active
      tags:
      - Shop Payment Settings
  /api/tontine/groups:
    post:
      consumes:
      - application/json
      description: Initialise un nouveau groupe de tontine pour un produit spécifique.
      parameters:
      - description: Détails du groupe à créer
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tontineusecase.CreateGroupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Payload invalide ou règles de tontine non respectées
          schema:
            $ref: '#/definitions/utils.AppError'
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "403":
          description: Interdit (KYC non validé ou droits insuffisants)
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Créer un groupe de tontine
      tags:
      - Tontine
  /api/tontine/groups/{group_id}/pay:
    post:
      consumes:
      - application/json
      description: Lance le processus de paiement pour la cotisation d'un cycle spécifique.
      parameters:
      - description: ID du groupe de tontine (UUID)
        in: path
        name: group_id
        required: true
        type: string
      - description: Détails du paiement (provider, phone_number, etc.)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tontineusecase.PayCycleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Payload invalide ou cycle non éligible
          schema:
            $ref: '#/definitions/utils.AppError'
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "404":
          description: Groupe ou cycle introuvable
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Payer une cotisation de tontine
      tags:
      - Tontine
  /api/tontine/groups/{group_id}/payments:
    get:
      consumes:
      - application/json
      description: Retourne l'historique des cotisations payées par un client spécifique
        dans un groupe de tontine.
      parameters:
      - description: ID du groupe de tontine (UUID)
        in: path
        name: group_id
        required: true
        type: string
      - description: ID du client (UUID)
        in: query
        name: customer_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "400":
          description: Paramètres manquants
          schema:
            $ref: '#/definitions/utils.AppError'
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "403":
          description: Interdit (accès aux données d'un autre client)
          schema:
            $ref: '#/definitions/utils.AppError'
        "404":
          description: Groupe introuvable
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Lister les paiements d'un client dans un groupe
      tags:
      - Tontine
  /api/tontine/groups/join:
    post:
      consumes:
      - application/json
      description: Permet à un client de rejoindre un groupe de tontine existant via
        un code d'invitation.
      parameters:
      - description: Code d'invitation et ID client
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tontineusecase.JoinGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Payload invalide ou code incorrect
          schema:
            $ref: '#/definitions/utils.AppError'
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "403":
          description: Interdit (KYC non validé)
          schema:
            $ref: '#/definitions/utils.AppError'
        "404":
          description: Groupe introuvable
          schema:
            $ref: '#/definitions/utils.AppError'
        "409":
          description: Groupe déjà complet ou client déjà membre
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Rejoindre un groupe de tontine
      tags:
      - Tontine
  /api/wallet:
    get:
      consumes:
      - application/json
      description: Retourne le solde et le statut actuel du portefeuille de la boutique
        active.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/wallet_handler.WalletResponse'
        "401":
          description: Contexte multi-tenant requis
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Obtenir les informations du wallet
      tags:
      - Merchant Wallet
  /api/wallet/deposit:
    post:
      consumes:
      - application/json
      description: Crédite manuellement le portefeuille de la boutique d'un montant
        spécifié.
      parameters:
      - description: Montant du dépôt et description optionnelle
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/wallet_handler.DepositRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Montant invalide ou payload incorrect
          schema:
            $ref: '#/definitions/utils.AppError'
        "401":
          description: Contexte multi-tenant requis
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Effectuer un dépôt manuel dans le wallet
      tags:
      - Merchant Wallet
  /api/wallet/freeze-status:
    get:
      consumes:
      - application/json
      description: Vérifie si le wallet de la boutique est actuellement gelé et retourne
        les détails (raison, durée, montant dû).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/wallet_handler.FreezeStatusResponse'
        "401":
          description: Contexte multi-tenant requis
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Obtenir le statut de gel du compte
      tags:
      - Merchant Wallet
  /api/wallet/unfreeze:
    post:
      consumes:
      - application/json
      description: Lève le gel du portefeuille après régularisation de la situation
        (paiement, annulation ou escalade).
      parameters:
      - description: Montant de régularisation et type de résolution (paid, waived,
          escalated)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/wallet_handler.UnfreezeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Résolution invalide ou payload incorrect
          schema:
            $ref: '#/definitions/utils.AppError'
        "401":
          description: Contexte multi-tenant requis
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Dégeler un compte marchand
      tags:
      - Merchant Wallet
  /api/wallet/withdraw:
    post:
      consumes:
      - application/json
      description: Débite le portefeuille de la boutique pour initier un virement
        vers un compte bancaire ou Mobile Money.
      parameters:
      - description: Montant du retrait et description optionnelle
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/wallet_handler.WithdrawRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Montant invalide, solde insuffisant ou payload incorrect
          schema:
            $ref: '#/definitions/utils.AppError'
        "401":
          description: Contexte multi-tenant requis
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Effectuer un retrait depuis le wallet
      tags:
      - Merchant Wallet
  /api/withdrawals:
    get:
      consumes:
      - application/json
      description: Retourne la liste paginée des demandes de retrait pour la boutique
        active.
      parameters:
      - description: 'Nombre de résultats (défaut: 50, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Décalage (défaut: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/withdrawaldto.WithdrawalResponse'
            type: array
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Lister les retraits de la boutique
      tags:
      - Withdrawals
    post:
      consumes:
      - application/json
      description: Crée une nouvelle demande de retrait de fonds depuis le portefeuille
        de la boutique vers un compte externe (Mobile Money ou Banque).
      parameters:
      - description: Détails du retrait (montant, méthode, etc.)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/withdrawaldto.CreateWithdrawalRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/withdrawaldto.WithdrawalResponse'
        "400":
          description: Payload invalide, solde insuffisant ou validation échouée
          schema:
            $ref: '#/definitions/utils.AppError'
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "403":
          description: Compte gelé ou interdit
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Créer une demande de retrait
      tags:
      - Withdrawals
  /api/withdrawals/{id}:
    get:
      consumes:
      - application/json
      description: Retourne les informations complètes et le statut d'une demande
        de retrait spécifique par son ID.
      parameters:
      - description: ID du retrait (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/withdrawaldto.WithdrawalResponse'
        "400":
          description: ID de retrait manquant
          schema:
            $ref: '#/definitions/utils.AppError'
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "403":
          description: Le retrait n'appartient pas à votre boutique
          schema:
            $ref: '#/definitions/utils.AppError'
        "404":
          description: Retrait introuvable
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Récupérer les détails d'un retrait
      tags:
      - Withdrawals
  /auth/me:
    get:
      description: Retourne les informations du profil de l'utilisateur authentifié.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/userdto.MeResponse'
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Obtenir le profil utilisateur
      tags:
      - Authentication
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Génère un nouveau couple de tokens (access et refresh) à partir
        d'un refresh token valide.
      parameters:
      - description: Le refresh token actuel (peut aussi être passé dans le header
          X-Refresh-Token)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/refreshhandler.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Nouveaux tokens d'accès
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Refresh token manquant ou format invalide
          schema:
            $ref: '#/definitions/utils.AppError'
        "401":
          description: Refresh token invalide ou expiré
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      summary: Rafraîchir les tokens d'authentification
      tags:
      - Authentication
  /health:
    get:
      description: Retourne un statut OK basique sans vérifier les dépendances externes.
        Utile pour les tests rapides.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Vérification de santé simple
      tags:
      - Health
  /health/live:
    get:
      description: Vérifie que l'API est en cours d'exécution. Requête légère sans
        vérification des dépendances externes. Idéal pour les probes Kubernetes.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness Probe (Sonde de vivacité)
      tags:
      - Health
  /health/ready:
    get:
      description: Vérifie que l'API est prête à traiter les requêtes en testant les
        connexions aux dépendances critiques (PostgreSQL, Redis).
      produces:
      - application/json
      responses:
        "200":
          description: Tous les systèmes sont opérationnels
          schema:
            $ref: '#/definitions/handler.HealthResponse'
        "503":
          description: Service indisponible (dépendances non prêtes)
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: Readiness Probe (Sonde de disponibilité)
      tags:
      - Health
  /login:
    post:
      consumes:
      - application/json
      description: Authentifie l'utilisateur et retourne les tokens JWT (access +
        refresh).
      parameters:
      - description: Identifiants de connexion
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/userdto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Tokens JWT et rôle
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Payload invalide
          schema:
            $ref: '#/definitions/utils.AppError'
        "401":
          description: Identifiants invalides
          schema:
            $ref: '#/definitions/utils.AppError'
        "429":
          description: Trop de tentatives (Rate Limit)
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      summary: Connexion utilisateur
      tags:
      - Authentication
  /logout:
    post:
      description: Révoque la session courante et invalide le token d'actualisation.
      produces:
      - application/json
      responses:
        "200":
          description: '{''message'': ''logged out successfully''}'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Non autorisé
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Déconnexion utilisateur
      tags:
      - Authentication
  /register:
    post:
      consumes:
      - application/json
      description: Crée un nouveau compte utilisateur avec un rôle par défaut "user".
      parameters:
      - description: Données d'inscription (email, password)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/userdto.RegisterUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: '{''message'': ''user registered'', ''user_id'': ''uuid''}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Payload invalide
          schema:
            $ref: '#/definitions/utils.AppError'
        "409":
          description: Email déjà enregistré
          schema:
            $ref: '#/definitions/utils.AppError'
        "422":
          description: Validation échouée
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      summary: Inscription d'un nouvel utilisateur
      tags:
      - Authentication
  /webhooks/{provider}:
    post:
      consumes:
      - application/json
      description: Endpoint public sécurisé pour recevoir les notifications de changement
        de statut de paiement des fournisseurs (Wave, Orange, Moov, YengaPay).
      parameters:
      - description: Code du fournisseur (wave, orange_money, moov_money, yenga_pay)
        in: path
        name: provider
        required: true
        type: string
      - description: Signature HMAC-SHA256 du payload
        in: header
        name: X-Signature
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Webhook reçu et traité avec succès
          schema:
            $ref: '#/definitions/paymentdto.WebhookResponse'
        "400":
          description: Fournisseur inconnu ou signature invalide
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Erreur interne du serveur
          schema:
            $ref: '#/definitions/utils.AppError'
      summary: Recevoir les webhooks de paiement
      tags:
      - Webhooks
  /ws/notifications:
    get:
      description: Établit une connexion WebSocket persistante pour recevoir des notifications
        en temps réel (commandes, paiements, etc.). Nécessite une authentification
        JWT valide.
      responses:
        "101":
          description: Switching Protocols (Connexion WebSocket établie avec succès)
        "401":
          description: Non autorisé (JWT manquant ou invalide)
          schema:
            $ref: '#/definitions/utils.AppError'
        "500":
          description: Échec de la mise à niveau vers WebSocket
          schema:
            $ref: '#/definitions/utils.AppError'
      security:
      - ApiKeyAuth: []
      summary: Connexion WebSocket pour les notifications temps réel
      tags:
      - WebSocket
schemes:
- http
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
