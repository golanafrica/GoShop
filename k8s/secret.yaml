# Template uniquement — ne jamais committer un vrai mot de passe.
# Prod recommandé :
#   kubectl create secret generic goshop-db -n goshop \
#     --from-literal=DB_PASSWORD='...' \
#     --from-literal=PGPASSWORD='...' \
#     --from-literal=POSTGRES_PASSWORD='...'
apiVersion: v1
kind: Secret
metadata:
  name: goshop-db
  namespace: goshop
type: Opaque
stringData:
  DB_PASSWORD: "root"
  PGPASSWORD: "root"
  POSTGRES_PASSWORD: "root"