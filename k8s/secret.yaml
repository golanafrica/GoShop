# ============================================================
# ⚠️  TEMPLATE UNIQUEMENT - NE JAMAIS DEPLOYER TEL QUEL
# ============================================================
# Ce fichier contient des placeholders INVALIDES qui provoqueront
# un échec de connexion à la base de données s'ils sont déployés.
#
# 📋 OPTIONS DE DÉPLOIEMENT EN PRODUCTION :
#
# Option 1 (RECOMMANDÉE) : Créer le secret via kubectl
#   kubectl create secret generic goshop-db -n goshop \
#     --from-literal=DB_PASSWORD='<GENERATED_SECURE_PASSWORD>' \
#     --from-literal=PGPASSWORD='<GENERATED_SECURE_PASSWORD>' \
#     --from-literal=POSTGRES_PASSWORD='<GENERATED_SECURE_PASSWORD>'
#
# Option 2 : Utiliser ce fichier après avoir remplacé les placeholders
#   (Décommentez les instructions PowerShell ci-dessous pour générer)
#
# 🔐 Génération de mot de passe sécurisé (PowerShell) :
#   $password = -join ((65..90) + (97..122) + (48..57) + (33..47) | Get-Random -Count 24 | ForEach-Object {[char]$_})
#   Write-Host "DB_PASSWORD=$password"
#   # Copiez cette valeur dans les 3 champs ci-dessous
#
# 🔒 EXIGENCES DE SÉCURITÉ :
#   - Minimum 16 caractères
#   - Mélange de majuscules, minuscules, chiffres, caractères spéciaux
#   - Jamais "root", "admin", "password" ou toute valeur du dictionnaire
#   - Rotation tous les 90 jours en production
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: goshop-db
  namespace: goshop
  labels:
    app: goshop
    component: database
    managed-by: manual
  annotations:
    description: "Database credentials for GoShop PostgreSQL"
    security.goshop/rotation-required: "true"
    security.goshop/rotation-interval: "90d"
type: Opaque
stringData:
  # ⚠️  PLACEHOLDER INVALIDE - À REMPLACER AVANT DÉPLOIEMENT
  # Ce mot de passe échouera volontairement à la connexion PostgreSQL
  # pour alerter l'opérateur qu'il doit être modifié.
  DB_PASSWORD: "CHANGE_ME_DB_PASSWORD_MIN_16_CHARS_WITH_SPECIAL_CHARS_!!!"
  
  # ⚠️  PLACEHOLDER INVALIDE - Doit être identique à DB_PASSWORD
  # Utilisé par les outils PostgreSQL natifs (psql, pg_dump, etc.)
  PGPASSWORD: "CHANGE_ME_DB_PASSWORD_MIN_16_CHARS_WITH_SPECIAL_CHARS_!!!"
  
  # ⚠️  PLACEHOLDER INVALIDE - Doit être identique à DB_PASSWORD
  # Utilisé par l'image Docker PostgreSQL pour l'initialisation
  POSTGRES_PASSWORD: "CHANGE_ME_DB_PASSWORD_MIN_16_CHARS_WITH_SPECIAL_CHARS_!!!"

# ============================================================
# 🧪 VALIDATION POST-DÉPLOIEMENT
# ============================================================
# Après application, vérifiez que le secret est correctement créé :
#   kubectl get secret goshop-db -n goshop
#   kubectl describe secret goshop-db -n goshop
#
# Vérifiez la connexion à la base de données :
#   kubectl exec -n goshop deployment/goshop-api -- env | grep DB_
#   kubectl logs -n goshop deployment/goshop-api | grep "database"
#
# 🚨 SI VOUS VOYEZ DES ERREURS DE CONNEXION :
#   C'est normal si vous n'avez pas encore remplacé les placeholders !
#   Appliquez la procédure de génération de mot de passe ci-dessus.
# ============================================================