apiVersion: 1

providers:
  - name: 'GoShop Dashboards'
    orgId: 1
    folder: 'GoShop'
    folderUid: 'goshop'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
