apiVersion: 1

datasources:
  # ========================================
  # PROMETHEUS - Métriques GoShop
  # ========================================
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: '5s'
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 2.50.0
    version: 1

  # ========================================
  # LOKI - Logs GoShop
  # ========================================
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
    version: 1