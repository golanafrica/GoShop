name: goshop-test

services:
  db-test:
    image: postgres:16-alpine
    container_name: goshop-db-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: goshop_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goshop_test"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  migrate-test:
    image: postgres:16-alpine
    container_name: goshop-migrate-test
    environment:
      - DB_HOST=db-test
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=root
      - DB_NAME=goshop_test
      - MIGRATIONS_DIR=/migrations
    volumes:
      - ./migrations:/migrations:ro
      - ./tests/loadtest/scripts/migrate.sh:/migrate.sh:ro
    depends_on:
      db-test:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"

  redis-test:
    image: redis:7-alpine
    container_name: goshop-redis-test
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s