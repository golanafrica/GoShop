# .github/workflows/ci-cd.yml
name: GoShop CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  # Aligné sur go.mod (module Goshop → go 1.25.0)
  GO_VERSION: '1.25.0'
  DOCKER_IMAGE: ghcr.io/golanafrica/goshop

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # BLOQUANT — exclusions historiques documentées (flaky / DB-heavy)
      - name: Run unit tests
        run: |
          set -euo pipefail
          PACKAGES=$(go list ./... | \
            grep -v '/tests$' | \
            grep -v '/tests/' | \
            grep -v '/usecase/order_usecase' | \
            grep -v '/usecase/auth_usecase' | \
            grep -v '/infrastructure/postgres' || true)
          if [ -z "${PACKAGES}" ]; then
            echo "No packages selected for unit tests"
            exit 1
          fi
          go test -v -count=1 -coverprofile=coverage.out ${PACKAGES}

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
        continue-on-error: true

  integration-test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: goshop_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create .env.test
        run: |
          cat > .env.test << 'EOF'
          APP_ENV=test
          APP_PORT=8081
          DB_HOST=localhost
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=root
          DB_NAME=goshop_test
          DB_SSLMODE=disable
          REDIS_HOST=localhost
          REDIS_PORT=6379
          BCRYPT_COST=4
          EOF

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests
        run: |
          set -euo pipefail
          if [ -d "tests/integration" ]; then
            go test -v -count=1 -tags=integration ./tests/integration/...
          elif [ -d "tests" ]; then
            go test -v -count=1 -tags=integration ./tests/...
          else
            echo "No integration test directory — skip"
          fi

  e2e-test:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: goshop_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create .env.test
        run: |
          cat > .env.test << 'EOF'
          APP_ENV=test
          APP_PORT=8081
          DB_HOST=localhost
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=root
          DB_NAME=goshop_test
          DB_SSLMODE=disable
          REDIS_HOST=localhost
          REDIS_PORT=6379
          BCRYPT_COST=4
          EOF

      - name: Download dependencies
        run: go mod download

      # Pas de -tags=e2e sauf si //go:build e2e dans les fichiers
      - name: Run E2E tests
        run: |
          set -euo pipefail
          if [ -d "tests/e2e" ]; then
            go test -v -count=1 ./tests/e2e/...
          else
            echo "No tests/e2e directory — skip"
          fi

  build:
    name: Build & Generate Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: |
          go mod download
          go mod verify

      - name: Install Swag
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate Swagger documentation
        run: |
          set -euo pipefail
          swag init \
            --generalInfo ./cmd/api/main.go \
            --dir ./ \
            --output ./docs \
            --parseDependency \
            --parseInternal
          test -f docs/docs.go

      - name: Build API binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -v -ldflags="-w -s" -o goshop-api ./cmd/api

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: |
          go mod download
          go mod verify

      # Docker pin plus prévisible que securego/gosec@master
      - name: Run gosec security scanner
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            securego/gosec:2.22.1 \
            -fmt=json \
            -out=gosec-report.json \
            -exclude-dir=tests \
            -exclude=G104 \
            ./...

      - name: Upload gosec report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: gosec-report.json
          retention-days: 30

      - name: Run govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=10m

  docker:
    name: Build, Scan & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, integration-test, e2e-test, build, security, lint]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: golanafrica
          password: ${{ secrets.CR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch

      # 1) Build local pour scan
      - name: Build Docker image (load)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Trivy AVANT push
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 3) Push seulement si Trivy OK
      - name: Push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max