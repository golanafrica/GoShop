# .github/workflows/ci-cd.yml
name: GoShop CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: '1.26.9'
  DOCKER_IMAGE: ghcr.io/golanafrica/goshop
  DB_HOST: localhost
  DB_PORT: '5432'
  DB_USER: postgres
  DB_PASSWORD: root
  DB_NAME: goshop_test

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download
      - name: Run unit tests
        run: |
          set -euo pipefail
          PACKAGES=$(go list ./... | \
            grep -v '/tests$' | \
            grep -v '/tests/' | \
            grep -v '/usecase/order_usecase' | \
            grep -v '/usecase/auth_usecase' | \
            grep -v '/usecase/shop_usecase' | \
            grep -v '/usecase/wallet_usecase' | \
            grep -v '/usecase/withdrawal_usecase' | \
            grep -v '/handler/orders' | \
            grep -v '/infrastructure/postgres' | \
            grep -v '/mocks/' || true)
          if [ -z "${PACKAGES}" ]; then
            echo "No packages selected"
            exit 1
          fi
          go test -v -count=1 -coverprofile=coverage.out ${PACKAGES}
      - uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  integration-test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: goshop_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Write .env.test
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          YENGA_PAY_API_KEY: ${{ secrets.YENGA_PAY_API_KEY }}
          YENGA_PAY_ORGANIZATION_ID: ${{ secrets.YENGA_PAY_ORGANIZATION_ID }}
          YENGA_PAY_PROJECT_ID: ${{ secrets.YENGA_PAY_PROJECT_ID }}
          YENGA_PAY_WEBHOOK_SECRET: ${{ secrets.YENGA_PAY_WEBHOOK_SECRET }}
          YENGA_PAY_ENV: ${{ secrets.YENGA_PAY_ENV }}
        run: |
          set -euo pipefail
          # EOF sans quotes → expansion des secrets
          cat > .env.test << EOF
          APP_ENV=test
          APP_PORT=8081
          DB_HOST=localhost
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=root
          DB_NAME=goshop_test
          DB_SSLMODE=disable
          REDIS_HOST=localhost
          REDIS_PORT=6379
          BCRYPT_COST=4
          JWT_SECRET=ci-test-jwt-secret-min-32-chars-xx
          JWT_EXPIRATION=15m
          REFRESH_SECRET=ci-test-refresh-secret-min-32-chars
          REFRESH_EXPIRATION=168h
          ENCRYPTION_KEY=${ENCRYPTION_KEY}
          YENGA_PAY_API_KEY=${YENGA_PAY_API_KEY}
          YENGA_PAY_ORGANIZATION_ID=${YENGA_PAY_ORGANIZATION_ID}
          YENGA_PAY_PROJECT_ID=${YENGA_PAY_PROJECT_ID}
          YENGA_PAY_WEBHOOK_SECRET=${YENGA_PAY_WEBHOOK_SECRET}
          YENGA_PAY_ENV=${YENGA_PAY_ENV:-test}
          ALLOW_X_SHOP_SLUG=true
          ENABLE_FORCE_RELEASE=true
          EOF
          mkdir -p tests/integration
          cp .env.test tests/.env.test 2>/dev/null || true
          cp .env.test tests/integration/.env.test 2>/dev/null || true
      - name: Apply migrations (ordered)
        env:
          PGPASSWORD: root
        run: |
          set -euo pipefail
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done
          for f in $(ls migrations/*.sql | sort); do
            echo ">>> $f"
            psql -h localhost -U postgres -d goshop_test -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: go mod download
      - name: Run integration tests
        run: |
          set -euo pipefail
          if [ -d tests/integration ]; then
            go test -v -count=1 -tags=integration ./tests/integration/...
          else
            echo "No tests/integration — skip"
          fi

  e2e-test:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: goshop_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Write .env.test
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          YENGA_PAY_API_KEY: ${{ secrets.YENGA_PAY_API_KEY }}
          YENGA_PAY_ORGANIZATION_ID: ${{ secrets.YENGA_PAY_ORGANIZATION_ID }}
          YENGA_PAY_PROJECT_ID: ${{ secrets.YENGA_PAY_PROJECT_ID }}
          YENGA_PAY_WEBHOOK_SECRET: ${{ secrets.YENGA_PAY_WEBHOOK_SECRET }}
          YENGA_PAY_ENV: ${{ secrets.YENGA_PAY_ENV }}
        run: |
          set -euo pipefail
          if [ -z "${YENGA_PAY_API_KEY:-}" ]; then
            echo "::error::YENGA_PAY_API_KEY secret is empty"
            exit 1
          fi
          cat > .env.test << EOF
          APP_ENV=test
          APP_PORT=8081
          DB_HOST=localhost
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=root
          DB_NAME=goshop_test
          DB_SSLMODE=disable
          REDIS_HOST=localhost
          REDIS_PORT=6379
          BCRYPT_COST=4
          JWT_SECRET=ci-test-jwt-secret-min-32-chars-xx
          JWT_EXPIRATION=15m
          REFRESH_SECRET=ci-test-refresh-secret-min-32-chars
          REFRESH_EXPIRATION=168h
          ENCRYPTION_KEY=${ENCRYPTION_KEY}
          YENGA_PAY_API_KEY=${YENGA_PAY_API_KEY}
          YENGA_PAY_ORGANIZATION_ID=${YENGA_PAY_ORGANIZATION_ID}
          YENGA_PAY_PROJECT_ID=${YENGA_PAY_PROJECT_ID}
          YENGA_PAY_WEBHOOK_SECRET=${YENGA_PAY_WEBHOOK_SECRET}
          YENGA_PAY_ENV=${YENGA_PAY_ENV:-test}
          ALLOW_X_SHOP_SLUG=true
          ENABLE_FORCE_RELEASE=true
          EOF
          mkdir -p tests/e2e tests/integration
          cp .env.test tests/e2e/.env.test
          cp .env.test tests/.env.test 2>/dev/null || true
          cp .env.test tests/integration/.env.test 2>/dev/null || true
      - name: Apply migrations (ordered)
        env:
          PGPASSWORD: root
        run: |
          set -euo pipefail
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done
          for f in $(ls migrations/*.sql | sort); do
            echo ">>> $f"
            psql -h localhost -U postgres -d goshop_test -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: go mod download
      - name: Run E2E tests
        run: |
          set -euo pipefail
          if [ -d tests/e2e ]; then
            go test -v -count=1 ./tests/e2e/...
          else
            echo "No tests/e2e — skip"
          fi

  build:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: |
          go mod download
          go mod verify
      - name: Build API binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          go version
          go env GOVERSION GOROOT GOPATH
          test -f cmd/api/main.go
          go build -v -ldflags="-w -s" -o goshop-api ./cmd/api
          ls -la goshop-api
      - name: Generate Swagger (best effort)
        continue-on-error: true
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          swag init --generalInfo ./cmd/api/main.go --dir ./ --output ./docs --parseDependency --parseInternal

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download && go mod verify
      - name: Run gosec
        id: gosec
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/src" -w /src \
            securego/gosec:2.22.1 \
            -fmt=json -out=gosec-report.json \
            -exclude-dir=tests -exclude=G104 \
            ./...
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: gosec-report.json
          retention-days: 30
      - name: Run govulncheck
        id: govuln
        continue-on-error: true
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Security scan warnings
        if: steps.gosec.outcome == 'failure' || steps.govuln.outcome == 'failure'
        run: |
          echo "::warning::gosec and/or govulncheck reported issues (non-blocking transition). See artifacts / logs."

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=10m
        

  docker:
    name: Build, Scan & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, integration-test, e2e-test, build, security, lint]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: golanafrica
          password: ${{ secrets.CR_PAT }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch
      - uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max